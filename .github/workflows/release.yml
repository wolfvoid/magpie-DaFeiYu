name: Mac release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/download_assets.py
      - run: node scripts/prepare.mjs
      - run: npm run build && npm test
      - run: npm run package
      - name: Verify and archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          codesign --verify --deep --strict "dist/蓝色大肥鱼-darwin-arm64/蓝色大肥鱼.app"
          ditto -c -k -X --keepParent --zlibCompressionLevel 9 "dist/蓝色大肥鱼-darwin-arm64/蓝色大肥鱼.app" "dist/DaFeiYu-magpie-${RELEASE_TAG}-macOS-arm64.zip"
          cd dist
          shasum -a 256 "DaFeiYu-magpie-${RELEASE_TAG}-macOS-arm64.zip" > SHA256SUMS.txt
          unzip -tq "DaFeiYu-magpie-${RELEASE_TAG}-macOS-arm64.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG · 蓝色大肥鱼 Mac × Magpie" --notes-file "docs/releases/${RELEASE_TAG}.md" "dist/DaFeiYu-magpie-${RELEASE_TAG}-macOS-arm64.zip" dist/SHA256SUMS.txt
